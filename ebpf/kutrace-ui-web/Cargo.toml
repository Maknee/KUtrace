[package]
name = "kutrace-ui-web"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.87"

[dependencies]
gloo-net = "0.6"
gloo-events = "0.2"
gloo-timers = "0.3"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
yew = { version = "=0.23.0", features = ["csr"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Blob",
  "BlobPropertyBag",
  "DomRect",
  "Element",
  "EventTarget",
  "HtmlElement",
  "HtmlAnchorElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "File",
  "FileList",
  "MouseEvent",
  "PointerEvent",
  "Storage",
  "SvgElement",
  "WheelEvent",
  "Window",
  "Url",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
