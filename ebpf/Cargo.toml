[workspace]
resolver = "2"
members = [
  "kutrace-common",
  "kutrace-collector",
  "kutrace-transform",
  "kutrace-client",
  "kutrace-bench",
  "kutrace-uprobe-fixture",
  "kutrace-usdt-fixture",
  "kutrace-trap-fixture",
  "kutrace-differential-fixture",
  "kutrace-ui",
]
exclude = ["kutrace-ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8.9"
aya = "0.14.0"
bytemuck = { version = "1.23", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cc = "1.2"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
object = { version = "0.39.1", default-features = false, features = ["elf", "read_core", "std"] }
rusqlite = { version = "0.40.1", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
